name: Build EN launches page

# ZH 源更新后自动生成英文镜像页，产物仍是静态文件（Cloudflare Pages 自动重新部署）。
# 密钥走 repo secrets（DEEPL_KEY 必填；GOOGLE_API_KEY 可选，用作 DeepL 兜底）。
on:
  push:
    paths:
      - 'launches.html'
      - 'make_en_v2.py'
      - 'check_en_page.py'
      - '.github/workflows/launches-en.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet beautifulsoup4

      # 译文映射缓存：断点续传 + 复用已译条目（省 DeepL 额度）。
      # 每次运行都保存新缓存，并优先恢复最近一次 → 增量翻译。
      #
      # ⚠️ 缓存命名空间版本 = 译文权威性版本，改一次等于强制一次「干净回采」。
      #
      # 为什么必须换 v3：缓存优先级高于「回采现有 EN 产物」（make_en_v2.py:509），
      # 所以 cache 里任何一条过期机翻都会被永久固化——即使人工把 EN 产物改对了，
      # 下一次 CI 也会用旧 cache 覆盖回去。历史上已被这条规则坑过两次：
      #   v1：CX-5 "gen-3" → "third-generation"、WR-V 徽标 "Range-wide price cut"
      #       → "across the rangeprice cut"
      #   v2：v2 缓存由含上述机翻的产物播种，同样无法自愈
      # 换到新命名空间后首跑必然空缓存 → 只走回采 → 结构一致时产物与线上逐字节相同
      # （实测 1,171/1,171 条命中、0 待译、exit 0），随即写入新缓存供后续增量复用。
      #
      # 因此：**修正 EN 产物后一定要同步 bump 这里**，否则修复会被旧缓存吃掉。
      # 切勿改回 en-map- / en-map-v2-。
      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: .cache/en_map_v2.json
          key: en-map-v3-${{ github.run_id }}
          restore-keys: |
            en-map-v3-

      # 在线翻译 API 闸门：默认关闭（未配置 repo variable 时即 off）。
      # 有余下未译条目时脚本会直接失败（不写产物），CI 红灯等你处理。
      # 要临时启用：GitHub → Settings → Secrets and variables → Actions → Variables
      #   新建变量 TRANSLATE_API = on（用完记得删掉/改回 off）
      - name: Build EN page
        env:
          TRANSLATE_API: ${{ vars.TRANSLATE_API }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python make_en_v2.py

      - name: Verify EN page
        run: python check_en_page.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- launches_en.html; then
            echo "EN 页无变化，跳过提交"
          else
            git add launches_en.html
            git commit -m "chore: 自动重建 launches_en.html（ZH 源更新）"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
