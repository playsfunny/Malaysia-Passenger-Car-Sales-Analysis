name: Build EN launches page

# ZH 源更新后自动生成英文镜像页，产物仍是静态文件（Cloudflare Pages 自动重新部署）。
# 密钥走 repo secrets（DEEPL_KEY 必填；GOOGLE_API_KEY 可选，用作 DeepL 兜底）。
on:
  push:
    paths:
      - 'launches.html'
      - 'make_en_v2.py'
      - 'check_en_page.py'
      - '.github/workflows/launches-en.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install --quiet beautifulsoup4

      # 译文映射缓存：断点续传 + 复用已译条目（省 DeepL 额度）。
      # 每次运行都保存新缓存，并优先恢复最近一次 → 增量翻译。
      #
      # ⚠️ 命名空间 v1（en-map-*）已废弃：里面混着 2026-09 之前机器翻译留下的旧条目，
      # 而缓存优先级高于「回采现有 EN 产物」（make_en_v2.py:509），会把线上人工润色过的
      # 译法重新冲成机翻（实测：CX-5 的 "gen-3" → "third-generation"、WR-V 徽标
      # "Range-wide price cut" → "across the rangeprice cut"）。换到 v2 命名空间后：
      # 首跑必然空缓存 → 走回采 → 结构一致时产物与线上逐字节相同（实测 1,171/1,171 条命中、
      # 0 待译），随即写入新缓存供后续增量复用。切勿改回 en-map-。
      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: .cache/en_map_v2.json
          key: en-map-v2-${{ github.run_id }}
          restore-keys: |
            en-map-v2-

      # 在线翻译 API 闸门：默认关闭（未配置 repo variable 时即 off）。
      # 有余下未译条目时脚本会直接失败（不写产物），CI 红灯等你处理。
      # 要临时启用：GitHub → Settings → Secrets and variables → Actions → Variables
      #   新建变量 TRANSLATE_API = on（用完记得删掉/改回 off）
      - name: Build EN page
        env:
          TRANSLATE_API: ${{ vars.TRANSLATE_API }}
          DEEPL_KEY: ${{ secrets.DEEPL_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python make_en_v2.py

      - name: Verify EN page
        run: python check_en_page.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- launches_en.html; then
            echo "EN 页无变化，跳过提交"
          else
            git add launches_en.html
            git commit -m "chore: 自动重建 launches_en.html（ZH 源更新）"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
